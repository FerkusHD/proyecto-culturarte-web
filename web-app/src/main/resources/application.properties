spring.application.name=pryecto-culturarte-web

# ============================================
# Configuración del Servidor Central (SOAP)
# ============================================
# Configuración para conectarse al Servidor Central que publica los Web Services SOAP.
# Todos los valores pueden ser sobrescritos mediante variables de entorno o parámetros
# de contexto definidos en web.xml.

# Dirección IP o hostname del Servidor Central
# Puede ser sobrescrito con la variable de entorno SOAP_SERVICE_HOST
# o con el parámetro de contexto soap.service.host en web.xml
soap.service.host=${SOAP_SERVICE_HOST:localhost}

# Puerto del Servidor Central
# Puede ser sobrescrito con la variable de entorno SOAP_SERVICE_PORT
# o con el parámetro de contexto soap.service.port en web.xml
soap.service.port=${SOAP_SERVICE_PORT:8081}

# Context path base donde se publican los Web Services
# Puede ser sobrescrito con la variable de entorno SOAP_SERVICE_CONTEXT_PATH
# o con el parámetro de contexto soap.service.context-path en web.xml
soap.service.context-path=${SOAP_SERVICE_CONTEXT_PATH:/soap/ws}

# URL completa del Servidor Central para consumir Web Services SOAP
# Se construye automáticamente desde host, port y context-path si no se especifica
# Puede ser sobrescrito con la variable de entorno SOAP_SERVICE_URL
# o con el parámetro de contexto soap.service.url en web.xml
soap.service.url=${SOAP_SERVICE_URL:http://${soap.service.host}:${soap.service.port}${soap.service.context-path}}

# ============================================
# Configuración de Base de Datos
# ============================================
# Nota: web-app SIEMPRE usa SOAP, no accede directamente a la BD
# La BD solo se usa para crear las tablas iniciales (ddl-auto=create-drop)
spring.datasource.url=jdbc:mysql://localhost:3306/culturarte?zeroDateTimeBehavior=CONVERT_TO_NULL
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================
# Configuración de Hibernate / JPA
# ============================================
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# ============================================
# Configuración de JSP
# ============================================
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp

# ============================================
# Configuración del Servidor Web
# ============================================
server.servlet.context-path=/
spring.main.allow-bean-definition-overriding=true

# ============================================
# Configuración de la Aplicación
# ============================================
app.uploads.dir=uploads

# ============================================
# Configuración de Correo Electrónico (JavaMail)
# ============================================
# Para pruebas, se recomienda usar un servidor SMTP tonto como DevNull
# Para producción, configurar con un servidor SMTP real (Gmail, SendGrid, etc.)

# Host del servidor SMTP
# Para DevNull (pruebas): usar localhost o la IP del servidor DevNull
# Para Gmail: smtp.gmail.com
# Para SendGrid: smtp.sendgrid.net
spring.mail.host=${MAIL_HOST:localhost}

# Puerto del servidor SMTP
# Para DevNull: generalmente 25 o 1025
# Para Gmail: 587 (TLS) o 465 (SSL)
# Para SendGrid: 587
spring.mail.port=${MAIL_PORT:1025}

# Usuario del servidor SMTP (opcional, requerido para autenticación)
spring.mail.username=${MAIL_USERNAME:}

# Contraseña del servidor SMTP (opcional, requerido para autenticación)
spring.mail.password=${MAIL_PASSWORD:}

# Protocolo de transporte (smtp)
spring.mail.protocol=smtp

# Propiedades adicionales
# Habilitar autenticación (si es necesario)
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}

# Habilitar STARTTLS (si es necesario)
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}

# Timeout de conexión (milisegundos)
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Email del remitente (debe configurarse)
spring.mail.from=${MAIL_FROM:noreply@culturarte.com}

# URL base del sitio web (para links en los emails)
app.base-url=${APP_BASE_URL:http://localhost:8080}
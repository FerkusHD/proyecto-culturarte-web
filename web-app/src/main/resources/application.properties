spring.application.name=pryecto-culturarte-web

# ============================================
# Configuración del Servidor Central (SOAP)
# ============================================

soap.service.host=${SOAP_SERVICE_HOST:localhost}

soap.service.port=${SOAP_SERVICE_PORT:8081}

soap.service.context-path=${SOAP_SERVICE_CONTEXT_PATH:/soap/ws}

soap.service.url=${SOAP_SERVICE_URL:http://${soap.service.host}:${soap.service.port}${soap.service.context-path}}

# ============================================
# Configuración de Base de Datos
# ============================================
spring.datasource.url=jdbc:mysql://localhost:3306/culturarte?zeroDateTimeBehavior=CONVERT_TO_NULL
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================
# Configuración de Hibernate / JPA
# ============================================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# ============================================
# Configuración de JSP
# ============================================
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp

# ============================================
# Configuración del Servidor Web
# ============================================
server.servlet.context-path=/
spring.main.allow-bean-definition-overriding=true

# ============================================
# Configuración de la Aplicación
# ============================================
app.uploads.dir=uploads

# ============================================
# Configuración de Correo Electrónico (JavaMail)
# ============================================
# Para pruebas, se recomienda usar un servidor SMTP tonto como DevNull
# Para producción, configurar con un servidor SMTP real (Gmail, SendGrid, etc.)

spring.mail.host=${MAIL_HOST:localhost}

# Puerto del servidor SMTP
# Para DevNull: generalmente 25 o 1025
# Para Gmail: 587 (TLS) o 465 (SSL)
# Para SendGrid: 587
spring.mail.port=${MAIL_PORT:1025}

spring.mail.username=${MAIL_USERNAME:}

spring.mail.password=${MAIL_PASSWORD:}

spring.mail.protocol=smtp

spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}

spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}

spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

spring.mail.from=${MAIL_FROM:noreply@culturarte.com}

# URL base del sitio web (para links en los emails)
app.base-url=${APP_BASE_URL:http://localhost:8080}
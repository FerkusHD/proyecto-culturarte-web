spring.application.name=pryecto-culturarte-web
spring.datasource.url=jdbc:mysql://localhost:3306/culturarte?zeroDateTimeBehavior=CONVERT_TO_NULL
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# JSP view resolver
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp


server.servlet.context-path=/

# Directory on the filesystem where uploaded images are stored (can be absolute or relative)
# Example absolute: /var/lib/culturarte/uploads
# Example relative: uploads
# Tip (WAR en Tomcat externo): si no configuras esta propiedad, por defecto usaremos ${catalina.base}/uploads
app.uploads.dir=uploads
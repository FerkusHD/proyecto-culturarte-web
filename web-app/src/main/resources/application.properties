spring.application.name=proyecto-culturarte-web
spring.datasource.url=jdbc:mysql://localhost:3306/culturarte?createDatabaseIfNotExist=true&zeroDateTimeBehavior=CONVERT_TO_NULL
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true

# JSP view resolver
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp


server.servlet.context-path=/

# Directory on the filesystem where uploaded images are stored (can be absolute or relative)
# Example absolute: /var/lib/culturarte/uploads
# Example relative: uploads
# Tip (WAR en Tomcat externo): si no configuras esta propiedad, por defecto usaremos ${catalina.base}/uploads
app.uploads.dir=uploads
spring.application.name=pryecto-culturarte-web
spring.datasource.url=jdbc:mysql://localhost:3306/culturarte?zeroDateTimeBehavior=CONVERT_TO_NULL
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate / JPA
# Nota: web-app SIEMPRE usa SOAP, no accede directamente a la BD
# La BD solo se usa para crear las tablas iniciales (ddl-auto=create-drop)
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# JSP view resolver
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp

# SOAP Service Configuration
# web-app SIEMPRE usa SOAP para acceder a core-business
soap.service.url=${SOAP_SERVICE_URL:http://localhost:8081/soap/ws}
spring.main.allow-bean-definition-overriding=true

server.servlet.context-path=/

app.uploads.dir=uploads
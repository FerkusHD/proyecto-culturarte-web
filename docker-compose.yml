services:
  db:
    image: mysql:8.4
    container_name: culturarte-mysql
    environment:
      MYSQL_ROOT_PASSWORD: "root"
      MYSQL_DATABASE: "culturarte"
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./web-app/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20

  soap:
    build:
      context: .
      dockerfile: soap-service/Dockerfile
    container_name: culturarte-soap
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://db:3306/culturarte?zeroDateTimeBehavior=CONVERT_TO_NULL"
      SPRING_DATASOURCE_USERNAME: "root"
      SPRING_DATASOURCE_PASSWORD: "root"
      SPRING_JPA_HIBERNATE_DDL_AUTO: "none"
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/soap/ws/categorias.wsdl || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30

  web:
    build:
      context: .
      dockerfile: web-app/Dockerfile
    container_name: culturarte-web
    depends_on:
      db:
        condition: service_healthy
      soap:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://db:3306/culturarte?zeroDateTimeBehavior=CONVERT_TO_NULL"
      SPRING_DATASOURCE_USERNAME: "root"
      SPRING_DATASOURCE_PASSWORD: "root"
      SPRING_JPA_HIBERNATE_DDL_AUTO: "create-drop"
      APP_UPLOADS_DIR: "/app/uploads"
      SOAP_SERVICE_URL: "http://soap:8081/soap/ws"
    ports:
      - "8080:8080"
    volumes:
      - ./uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30

  app:
    build:
      context: .
      dockerfile: jar/Dockerfile
    container_name: culturarte-app
    depends_on:
      web:
        condition: service_healthy
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://db:3306/culturarte?zeroDateTimeBehavior=CONVERT_TO_NULL"
      SPRING_DATASOURCE_USERNAME: "root"
      SPRING_DATASOURCE_PASSWORD: "root"
      SPRING_MAIN_WEB_APPLICATION_TYPE: "none"
    profiles: ["app"]

volumes:
  db_data:

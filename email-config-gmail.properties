# Configuración para enviar emails REALES usando Gmail
# 
# INSTRUCCIONES:
# 1. Reemplaza TU_EMAIL@gmail.com con tu email de Gmail
# 2. Reemplaza TU_CONTRASEÑA_DE_APLICACION con la contraseña generada en Gmail
# 3. Copia este archivo a: ~/.Culturarte/soap-service.properties
#
# Para generar una contraseña de aplicación en Gmail:
# - Ve a https://myaccount.google.com/
# - Seguridad → Verificación en dos pasos (actívala)
# - Contraseñas de aplicaciones → Genera una nueva
# - Copia la contraseña de 16 caracteres

# Configuración SMTP de Gmail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=TU_EMAIL@gmail.com
spring.mail.password=TU_CONTRASEÑA_DE_APLICACION
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.debug=true

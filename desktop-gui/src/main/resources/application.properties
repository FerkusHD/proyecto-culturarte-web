spring.application.name=app
spring.datasource.url=jdbc:mysql://localhost:3306/culturarte?zeroDateTimeBehavior=CONVERT_TO_NULL
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.main.web-application-type=none
spring.main.


# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Directory on the filesystem where uploaded images are stored (can be absolute or relative)
# Example absolute: /var/lib/culturarte/uploads
# Example relative: uploads
# Tip: Keep a single shared folder across environments; override with -Dapp.uploads.dir=/abs/path
app.uploads.dir=uploads
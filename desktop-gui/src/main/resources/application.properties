spring.application.name=app
spring.config.import=optional:file:${user.home}/.Culturarte/config.properties,optional:file:${user.home}/.Culturarte/desktop-gui.properties
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/culturarte?zeroDateTimeBehavior=CONVERT_TO_NULL}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.main.web-application-type=none


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

app.uploads.dir=uploads
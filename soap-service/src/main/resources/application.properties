
soap.server.host=${SOAP_SERVER_HOST:0.0.0.0}

soap.server.port=${SOAP_SERVER_PORT:8081}

soap.server.context-path=${SOAP_SERVER_CONTEXT_PATH:/soap}

soap.server.base-url=${SOAP_SERVER_BASE_URL:}

server.port=${soap.server.port}
server.servlet.context-path=${soap.server.context-path}
server.address=${soap.server.host}
spring.main.banner-mode=console


# Importar configuración externa
spring.config.import=optional:file:${user.home}/.Culturarte/config.properties,optional:file:${user.home}/.Culturarte/soap-service.properties

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/culturarte?zeroDateTimeBehavior=CONVERT_TO_NULL}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

spring.profiles.active=dev

# Configuración de Email (JavaMail)
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:25}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.starttls.required=false
spring.mail.properties.mail.debug=true

# URL base de la aplicación web (para links en emails)
app.base-url=${APP_BASE_URL:http://localhost:8080}
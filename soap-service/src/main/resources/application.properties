# ============================================
# Configuración del Servidor Central (SOAP)
# ============================================
# Esta configuración permite especificar la dirección IP, puerto y contexto
# donde se publican los Web Services SOAP. Todos los valores pueden ser
# sobrescritos mediante variables de entorno.

# Dirección IP o hostname donde se publica el servicio
# Puede ser sobrescrito con la variable de entorno SOAP_SERVER_HOST
soap.server.host=${SOAP_SERVER_HOST:0.0.0.0}

# Puerto donde se publica el servicio
# Puede ser sobrescrito con la variable de entorno SOAP_SERVER_PORT
soap.server.port=${SOAP_SERVER_PORT:8081}

# Context path base donde se publican los Web Services
# Puede ser sobrescrito con la variable de entorno SOAP_SERVER_CONTEXT_PATH
soap.server.context-path=${SOAP_SERVER_CONTEXT_PATH:/soap}

# URL base completa del servicio (se construye automáticamente si no se especifica)
# Puede ser sobrescrito con la variable de entorno SOAP_SERVER_BASE_URL
# Formato: http://{host}:{port}{context-path}/ws
soap.server.base-url=${SOAP_SERVER_BASE_URL:}

# ============================================
# Configuración del Servidor Web (Spring Boot)
# ============================================
# Spring Boot usa esta configuración para iniciar el servidor embebido
server.port=${soap.server.port}
server.servlet.context-path=${soap.server.context-path}
server.address=${soap.server.host}
spring.main.banner-mode=console

# ============================================
# Configuración de Base de Datos
# ============================================
# Puede ser sobrescrita mediante variables de entorno
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/culturarte?zeroDateTimeBehavior=CONVERT_TO_NULL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================
# Configuración de Hibernate / JPA
# ============================================
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

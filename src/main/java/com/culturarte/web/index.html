<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Culturarte</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <h1>Bienvenido/a a Culturarte</h1>
    <form action="" method="post">
     <div class="formulario">
        <label for="nickname">Nickname</label>
        <input id="nickname" name="nickname" type="text" maxlength="30" placeholder="nickname" required>
     </div>

     <div class="formulario">
        <label for="nombre">Nombre</label>            
        <input id="nombre"  name="nombre" type="text" placeholder="nombre" required>
     </div>
       
     <div class="formulario">
        <label for="apellido">Apellido</label>            
        <input id="apellido"  name="apellido" type="text" placeholder="apellido" required>
     </div>

     <div class="formulario">
        <label for="contraseña">Contraseña</label>            
        <input id="contraseña"  name="contraseña" type="password" placeholder="contraseña" required>
     </div>

    <div class="formulario">
        <label for="confirmar">Confirmar contraseña</label>            
        <input id="confirmar" name="confirmar" type="password" placeholder="confirmar" required>
     </div>

     <div>
      <p id="mensaje"></p>
     </div>

     <div class="formulario">
        <label for="email">Email</label>            
        <input id="email" name="email" type="email" placeholder="email" required>
     </div>

     <div class="formulario">
        <label for="fecha">Fecha de nacimiento</label>            
        <input id="fecha"  name="fecha" type="date" required>
     </div>

     <div class="formulario">
      <label for="imagen">Subir imagen:</label>
      <input type="file" id="imagen" name="imagen" accept="image/*">
     </div>

     <fieldset class="checkbox-group">
      <legend>Selecciona tu rol</legend>
      <label>
        <input id="colaborador" type="checkbox" name="rol[]" value="colaborador">
        Colaborador
      </label>
      <label>
        <input id="proponente" onclick="mostrar()" type="checkbox" name="rol[]" value="proponente">
        Proponente
      </label>
    </fieldset>
     
    <div class="campo-extra">
        <label for="direccion">Dirección</label>            
        <input id="direccion" name="direccion" type="text" placeholder="direccion">
     </div>

     <div class="campo-extra">
        <label for="biografia">Biografia</label>            
        <textarea id="biografia" name="biografia" type="textarea" placeholder="biografia"></textarea>
     </div>

     <div class="campo-extra">
        <label for="web">Sitio web</label>            
        <input id="web" name="web" type="text" placeholder="sitio web">
     </div>

    <button type="submit">Registrarse</button>
    </form>
    
   <script>
   function mostrar() {
   const checkbox = document.getElementById('proponente');
   const extras = document.querySelectorAll('.campo-extra');

   extras.forEach(div => {
   div.style.display = checkbox.checked ? 'flex' : 'none';
   });
   }

   // Ocultar al cargar la página
   window.addEventListener('DOMContentLoaded', () => {
   const extras = document.querySelectorAll('.campo-extra');
   extras.forEach(div => div.style.display = 'none');
   });
</script>

<script src="validarContraseña.js"></script>
</body>
</html>

# Configuración para usar Mailtrap (Recomendado para desarrollo)
# 
# Mailtrap captura los emails y los muestra en una bandeja web
# Los emails NO se envían a los destinatarios reales
# 
# INSTRUCCIONES:
# 1. Regístrate gratis en https://mailtrap.io/
# 2. Crea un inbox
# 3. Copia las credenciales SMTP que te da Mailtrap
# 4. Reemplaza USERNAME y PASSWORD abajo
# 5. Copia este archivo a: ~/.Culturarte/soap-service.properties

# Configuración SMTP de Mailtrap
spring.mail.host=sandbox.smtp.mailtrap.io
spring.mail.port=2525
spring.mail.username=TU_MAILTRAP_USERNAME
spring.mail.password=TU_MAILTRAP_PASSWORD
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.debug=true
